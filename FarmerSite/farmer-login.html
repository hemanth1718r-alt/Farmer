<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farmer Login | AgriQueue</title>
  <link rel="stylesheet" href="farmer.css">
</head>
<body class="auth">
  <!-- Language Switcher in Upper Right -->
  <div class="lang-switcher">
    🌐 <select id="langSelect">
      <option value="en">English</option>
      <option value="kn">ಕನ್ನಡ</option>
      <option value="hi">हिन्दी</option>
    </select>
  </div>

  <div class="auth-card" id="loginPage">
    <div class="logo" data-i18n="logo_title">🌾 AgriQueue</div>
    <span class="tag" data-i18n="farmer_portal">FARMER PORTAL</span>
    <h1 data-i18n="farmer_login">Farmer Login</h1>
    <p data-i18n="login_sub">Sign in using your mobile number and password to access the slot booking system.</p>
    
    <form id="loginForm">
      <label for="phone" data-i18n="mobile_lbl">Mobile Number</label>
      <input id="phone" type="text" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required data-i18n-placeholder="placeholder_phone" placeholder="Enter 10-digit mobile number">
      
      <label for="password" data-i18n="pass_lbl" style="margin-top: 15px;">Password</label>
      <input id="password" type="password" required data-i18n-placeholder="placeholder_pass" placeholder="Enter your password">
      
      <button class="btn" type="submit" data-i18n="signin_btn">Sign In</button>
    </form>
    
    <div class="row-links" id="rowLinks">
      <button class="link" id="btnForgot" data-i18n="forgot_link">Forgot Password?</button>
      <a href="farmer-register.html" data-i18n="new_farmer">New Farmer? Register Here</a>
    </div>
    
    <div id="message"></div>
    
    <!-- Forgot Password Step-by-Step Wizard -->
    <div id="forgot" class="hidden wizard-forgot">
      <hr style="border: 0; border-top: 1px solid var(--line); margin: 25px 0;">
      <h3 data-i18n="forgot_title">Reset Password</h3>
      <p style="font-size: 12px; margin-top: -10px; color: var(--muted);" data-i18n="forgot_sub">Enter your registered mobile number to receive a verification reset code.</p>
      
      <!-- Step 1: Request Code -->
      <div id="step1">
        <label for="fphone" data-i18n="mobile_lbl">Mobile Number</label>
        <input id="fphone" type="text" maxlength="10" data-i18n-placeholder="placeholder_phone" placeholder="10-digit mobile number">
        <button class="btn" type="button" id="btnSendCode">Send Reset Code</button>
      </div>
      
      <!-- Step 2: Verification Code -->
      <div id="step2" class="hidden">
        <div id="demoCode" class="demo-code"></div>
        <label for="rcode" data-i18n="otp_lbl">6-Digit Reset Code (OTP)</label>
        <input id="rcode" type="text" maxlength="6" data-i18n-placeholder="placeholder_otp" placeholder="Enter reset code">
        <button class="btn" type="button" id="btnVerifyCode" style="margin-top: 15px;">Verify OTP</button>
      </div>
      
      <!-- Step 3: Input New Password -->
      <div id="step3" class="hidden">
        <label for="newpass" data-i18n="new_pass_lbl">New Password</label>
        <input id="newpass" type="password" minlength="6" data-i18n-placeholder="placeholder_newpass" placeholder="Enter at least 6 characters">
        
        <label for="confpass" data-i18n="confirm_pass_lbl" style="margin-top: 15px;">Confirm New Password</label>
        <input id="confpass" type="password" minlength="6" data-i18n-placeholder="placeholder_confpass" placeholder="Re-enter new password">
        
        <button class="btn" type="button" id="btnResetPassword">Reset Password</button>
      </div>
      
      <!-- Step 4: Success state -->
      <div id="step4" class="hidden">
        <div class="success" data-i18n="msg_reset_success">Password reset successfully. You can now login.</div>
      </div>
      
      <button class="link back" id="btnBackToLogin" data-i18n="back_to_login">Back to Farmer Login</button>
    </div>
  </div>
  
  <script src="farmer.js"></script>
</body>
</html>
