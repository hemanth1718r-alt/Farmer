<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farmer Login | AgriQueue</title>
  <link rel="stylesheet" href="farmer.css">
</head>
<body class="auth">
  <div class="auth-card" id="loginPage">
    <div class="logo">🌾 AgriQueue</div>
    <span class="tag">FARMER PORTAL</span>
    <h1>Farmer Login</h1>
    <p>Sign in using your mobile number and password to access the slot booking system.</p>
    
    <form id="loginForm">
      <label for="phone">Mobile Number</label>
      <input id="phone" type="text" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required placeholder="Enter 10-digit mobile number">
      
      <label for="password">Password</label>
      <input id="password" type="password" required placeholder="Enter your password">
      
      <button class="btn" type="submit">Sign In</button>
    </form>
    
    <div class="row-links">
      <button class="link" id="btnForgot">Forgot Password?</button>
      <a href="farmer-register.html">New Farmer? Register Here</a>
    </div>
    
    <div id="message"></div>
    
    <!-- Forgot Password Reset Box -->
    <div id="forgot" class="hidden">
      <hr style="border: 0; border-top: 1px solid var(--line); margin: 25px 0;">
      <h3>Reset Password</h3>
      <p style="font-size: 12px; margin-top: -10px; color: var(--muted);">Request a verification reset code for this demo.</p>
      
      <label for="fphone">Mobile Number</label>
      <input id="fphone" type="text" maxlength="10" placeholder="10-digit mobile number">
      
      <button class="btn" type="button" id="btnSendCode" style="background: var(--dark); margin-top: 10px;">Send Reset Code</button>
      
      <div id="codeBox" class="hidden">
        <div id="demoCode" class="demo-code"></div>
        
        <label for="rcode">6-Digit Reset Code</label>
        <input id="rcode" type="text" maxlength="6" placeholder="Enter reset code">
        
        <label for="newpass">New Password</label>
        <input id="newpass" type="password" minlength="6" placeholder="Enter at least 6 characters">
        
        <button class="btn" type="button" id="btnResetPassword" style="margin-top: 15px;">Update Password</button>
      </div>
    </div>
  </div>
  
  <script src="farmer.js"></script>
</body>
</html>
