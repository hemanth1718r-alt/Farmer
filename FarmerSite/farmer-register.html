<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farmer Registration | AgriQueue</title>
  <link rel="stylesheet" href="farmer.css">
</head>
<body class="auth">
  <div class="auth-card wide">
    <div class="logo">🌾 AgriQueue</div>
    <span class="tag">NEW FARMER REGISTRATION</span>
    <h1>Create Farmer Account</h1>
    <p>Please enter your information to register. This allows booking queue slots for procurement.</p>
    
    <form id="regForm" class="grid">
      <label for="name">Full Name
        <input id="name" type="text" required placeholder="Farmer's full name">
      </label>
      
      <label for="phone">Mobile Number
        <input id="phone" type="text" pattern="[0-9]{10}" maxlength="10" required placeholder="10-digit mobile number">
      </label>
      
      <label for="idNumber">Aadhaar / ID Number
        <input id="idNumber" type="text" required placeholder="Aadhaar or Government ID">
      </label>
      
      <label for="crop">Crop Type
        <select id="crop" required>
          <option value="">Select crop type</option>
          <option value="Paddy">Paddy</option>
          <option value="Wheat">Wheat</option>
          <option value="Maize">Maize</option>
          <option value="Cotton">Cotton</option>
          <option value="Groundnut">Groundnut</option>
          <option value="Sugarcane">Sugarcane</option>
          <option value="Other">Other Crop</option>
        </select>
      </label>
      
      <label for="quantity">Produce Quantity (kg)
        <input id="quantity" type="number" min="1" required placeholder="Estimated weight in kg">
      </label>
      
      <label for="distance">Travel Distance (km)
        <input id="distance" type="number" min="0" value="0" required placeholder="Distance to procurement centre">
      </label>
      
      <label for="password">Password
        <input id="password" type="password" minlength="6" required placeholder="At least 6 characters">
      </label>
      
      <label for="confirm">Confirm Password
        <input id="confirm" type="password" minlength="6" required placeholder="Re-enter your password">
      </label>
      
      <label class="check">
        <input id="perishable" type="checkbox">
        <span>My crop is perishable / requires urgent procurement</span>
      </label>
      
      <button class="btn" type="submit">Create Farmer Account</button>
    </form>
    
    <div id="msg"></div>
    <a class="back" href="farmer-login.html">← Back to Farmer Login</a>
  </div>
  
  <script src="farmer.js"></script>
</body>
</html>
