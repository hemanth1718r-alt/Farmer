<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farmer Registration | AgriQueue</title>
  <link rel="stylesheet" href="farmer.css">
</head>
<body class="auth">
  <!-- Language Switcher in Upper Right -->
  <div class="lang-switcher">
    🌐 <select id="langSelect">
      <option value="en">English</option>
      <option value="kn">ಕನ್ನಡ</option>
      <option value="hi">हिन्दी</option>
    </select>
  </div>

  <div class="auth-card">
    <div class="logo" data-i18n="logo_title">🌾 AgriQueue</div>
    <span class="tag" data-i18n="reg_title">Create Farmer Account</span>
    <h1 data-i18n="reg_title">Create Farmer Account</h1>
    <p data-i18n="reg_sub">Please enter your information to register. This allows booking queue slots for procurement.</p>
    
    <form id="regForm">
      <label for="name" data-i18n="name_lbl">Full Name</label>
      <input id="name" type="text" required data-i18n-placeholder="placeholder_name" placeholder="Farmer's full name">
      
      <label for="phone" data-i18n="mobile_lbl" style="margin-top: 15px;">Mobile Number</label>
      <input id="phone" type="text" pattern="[0-9]{10}" maxlength="10" required data-i18n-placeholder="placeholder_phone" placeholder="10-digit mobile number">
      
      <label for="password" data-i18n="pass_lbl" style="margin-top: 15px;">Password</label>
      <input id="password" type="password" minlength="6" required data-i18n-placeholder="placeholder_pass" placeholder="Enter at least 6 characters">
      
      <label class="check" style="margin-top: 20px;">
        <input id="perishable" type="checkbox">
        <span data-i18n="perishable_lbl">My crop is perishable / requires urgent procurement</span>
      </label>
      
      <button class="btn" type="submit" data-i18n="create_btn">Create Farmer Account</button>
    </form>
    
    <div id="msg"></div>
    <a class="back" href="farmer-login.html" data-i18n="already_account">Already have an account? Login</a>
  </div>
  
  <script src="farmer.js"></script>
</body>
</html>
